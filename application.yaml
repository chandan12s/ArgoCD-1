apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-argo-appl
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/chandan12s/ArgoCD-1.git
    targetRevision: HEAD
    path: .
  destination: 
    server: https://kubernetes.default.svc
    namespace: myargo

  syncPolicy:
    syncOptions:
    - CreateNamespace=true

    automated:
      selfHeal: true
      prune: true